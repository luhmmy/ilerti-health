<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="ilertiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#115E59" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80" />
      <stop offset="100%" stop-color="#22C55E" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#042F2E" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background rounded squircle with shadow -->
  <rect width="512" height="512" rx="120" fill="url(#ilertiBg)" />
  <rect x="12" y="12" width="488" height="488" rx="110" stroke="#5EEAD4" stroke-width="12" stroke-opacity="0.35" fill="none" />

  <!-- Center White Emblem Group -->
  <g filter="url(#shadow)">
    <!-- Medical Cross Arms -->
    <rect x="220" y="100" width="72" height="312" rx="36" fill="#FFFFFF" />
    <rect x="100" y="220" width="312" height="72" rx="36" fill="#FFFFFF" />

    <!-- Vibrant Healing Leaf in Top-Right quadrant -->
    <path d="M256 120 C340 120 392 172 392 256 C310 256 256 200 256 120 Z" fill="url(#leafGrad)" />
    
    <!-- Pulse/Center Dot -->
    <circle cx="256" cy="256" r="28" fill="#0D9488" />
    <circle cx="256" cy="256" r="14" fill="#FFFFFF" />
  </g>
</svg>
